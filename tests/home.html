<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Chiron Home mock</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; background: #e9e4dc; color: #1f1b16; font: 14px system-ui, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 16px; background: #1f1b16; color: #f3ede4; }
  .bar b { font-weight: 600; opacity: .7; margin-right: 2px; }
  .bar button { font: inherit; padding: 5px 10px; border-radius: 7px; border: 1px solid #5c554c; background: transparent; color: inherit; cursor: pointer; }
  .bar button[aria-pressed="true"] { background: #c8782a; border-color: #c8782a; color: #fff; }
  .group { display: inline-flex; gap: 4px; align-items: center; }
  .stage { padding: 20px 16px 40px; overflow-x: auto; }
  iframe { display: block; margin: 0 auto; border: 0; border-radius: 12px; box-shadow: 0 20px 60px #0003; background: #f7f3ec; }
  #log { max-width: 1280px; margin: 0 auto; font: 12px ui-monospace, Menlo, monospace; white-space: pre-wrap; opacity: .75; max-height: 180px; overflow: auto; padding: 0 16px; }
  @media (prefers-color-scheme: dark) { body { background: #0e0c0a; color: #f3ede4; } iframe { background: #171411; } }
  /* native=1: a fake macOS window. Vibrancy = a blurred desktop under a tint; the page itself draws no background. */
  .win { position: relative; margin: 0 auto; border-radius: 14px; overflow: hidden; width: max-content;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.25), 0 30px 80px -20px rgba(0,0,0,.45);
    background: linear-gradient(rgba(244,245,250,.60), rgba(244,245,250,.60)),
      radial-gradient(40% 45% at 10% 15%, #6FA8FF, transparent 70%), radial-gradient(40% 40% at 90% 10%, #B79CFF, transparent 70%),
      radial-gradient(45% 50% at 85% 90%, #FFB59A, transparent 70%), radial-gradient(40% 40% at 5% 95%, #7FDCD6, transparent 70%), #DDE3F2; }
  .win.dark { background: linear-gradient(rgba(24,24,30,.62), rgba(24,24,30,.62)),
      radial-gradient(40% 45% at 10% 15%, #1D4ED8, transparent 70%), radial-gradient(40% 40% at 90% 10%, #6D28D9, transparent 70%),
      radial-gradient(45% 50% at 85% 90%, #9A3412, transparent 70%), radial-gradient(40% 40% at 5% 95%, #0E7490, transparent 70%), #0B0D17; }
  .win iframe { background: transparent; border-radius: 0; box-shadow: none; }
  .lights { position: absolute; top: 9px; left: 12px; display: flex; gap: 8px; z-index: 3; pointer-events: none; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
  .lights i:nth-child(1) { background: #FF5F57; } .lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
  body.bare { background: #000; } body.bare .bar, body.bare #log { display: none; } body.bare .stage { padding: 0; overflow: hidden; }
  body.bare iframe { border-radius: 0; box-shadow: none; } body.bare .win { border-radius: 0; box-shadow: none; }
  body.desk { background: linear-gradient(160deg, #8EA9E8, #B9A6E6 55%, #EDB9A6); } body.desk.dark { background: linear-gradient(160deg, #0B1530, #1B1236 55%, #2A1414); }
</style>
<div class="bar" role="toolbar" aria-label="Mock controls">
  <span class="group" id="fx"><b>Fixture</b><button data-fx="empty">empty</button><button data-fx="typical">typical</button><button data-fx="errors">errors</button></span>
  <span class="group" id="vw"><b>View</b><button data-v="home">home</button><button data-v="settings">settings</button><button data-v="settings/voice">settings/voice</button></span>
  <span class="group" id="wd"><b>Width</b><button data-w="1280">1280</button><button data-w="880">880</button><button data-w="560">560</button></span>
  <span class="group" id="th"><b>Theme</b><button data-t="">auto</button><button data-t="light">light</button><button data-t="dark">dark</button></span>
  <span class="group"><b>Window</b><button id="nativeBtn" title="Simulate the app window: html.native, vibrancy, traffic lights">native</button></span>
  <span class="group"><b>Push</b><button id="pushState">state (+120 words)</button><button id="pushLang">lang (native)</button><button id="pushConn">connection: Jev ok</button></span>
</div>
<div class="stage"><div class="win-host" id="host"><iframe id="frame" title="Chiron Home"></iframe></div></div>
<div id="log"></div>

<script>
'use strict';
const frame = document.getElementById('frame'), log = document.getElementById('log');
const FIXTURES = JSON.parse(document.getElementById('fixtures').textContent);
const SIZES = { 1280: [1280, 800], 880: [880, 720], 560: [560, 720] };
const ui = { fx: 'typical', w: '1280', theme: '', lang: 'en', view: 'home', native: false };
try { Object.assign(ui, JSON.parse(localStorage.getItem('chiron-mock') || '{}')); } catch (e) {}
// Query params for headless screenshots: ?fixture=&lang=&theme=&view=home|settings|settings/<section>&width=1280|880|560&chrome=0&native=1
const q = new URLSearchParams(location.search);
const BARE = q.get('chrome') === '0';
if (q.has('fixture') && FIXTURES[q.get('fixture')]) ui.fx = q.get('fixture');
if (['en', 'hi'].includes(q.get('lang'))) ui.lang = q.get('lang');
if (q.has('theme')) ui.theme = ['light', 'dark'].includes(q.get('theme')) ? q.get('theme') : '';
if (q.has('view')) ui.view = /^(home|settings(\/\w+)?)$/.test(q.get('view')) ? q.get('view') : 'home';
if (q.has('width')) ui.w = SIZES[q.get('width')] ? q.get('width') : ui.w;
if (q.has('native')) ui.native = q.get('native') === '1';
if (!SIZES[ui.w]) ui.w = '1280';
if (BARE) document.body.classList.add('bare');
let db, page = '';

const clone = v => JSON.parse(JSON.stringify(v));
// "-5m" → an ISO time that many minutes/hours/days ago, so relative times stay meaningful.
function times(v) {
  if (Array.isArray(v)) return v.map(times);
  if (v && typeof v === 'object') { const o = {}; for (const k in v) o[k] = times(v[k]); return o; }
  const m = typeof v === 'string' && /^-(\d+)([smhd])$/.exec(v);
  return m ? new Date(Date.now() - m[1] * { s: 1e3, m: 6e4, h: 36e5, d: 864e5 }[m[2]]).toISOString() : v;
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const note = (...a) => { log.textContent = a.join(' ') + '\n' + log.textContent.slice(0, 4000); };
function publicConn() { const c = clone(db.conn); for (const k in c) if (c[k] && typeof c[k] === 'object') delete c[k]._value; return c; }

async function handle(method, args) {
  const fail = db.fail && db.fail[method];
  if (fail) { await wait(250); throw new Error(fail); }
  switch (method) {
    case 'state.get': await wait(120); return clone(db.state);
    case 'lang.set': await wait(80); db.state.lang = args.lang; db.prefs.lang = args.lang; return { ok: true };
    case 'prefs.get': await wait(60); return Object.assign({ hotkeyLabel: 'fn', dictateHotkeyLabel: '', talkKey: 'fn', globeTaken: true, speak: true, speakRate: 0.85 }, clone(db.prefs));
    case 'prefs.set': await wait(150); db.prefs[args.k] = args.v; if (args.k === 'capUsd' && db.state.spend && typeof db.state.spend === 'object') db.state.spend.cap_usd = args.v; return { ok: true };
    case 'conn.list': await wait(90); return publicConn();
    case 'conn.save': await wait(200); db.conn[args.name] = Object.assign({}, db.conn[args.name], { saved: true, last4: String(args.value).slice(-4), _value: args.value }); return { ok: true, last4: String(args.value).slice(-4) };
    case 'conn.clear': await wait(150); db.conn[args.name] = Object.assign({}, db.conn[args.name], { saved: false, last4: null, _value: null }); return { ok: true };
    // A typed value is only tested here; the page calls conn.save after it passes.
    case 'conn.test': {
      await wait(900 + Math.random() * 500);
      const key = args.value || (db.conn[args.name] || {})._value || '';
      if (!key) return { ok: false, kind: 'nokey', detail: 'Add a key first.' };
      if (/timeout/.test(key)) return { ok: false, kind: 'offline', detail: 'Request timed out after 3 s' };
      if (/bad/.test(key)) return { ok: false, kind: 'rejected', detail: '401 invalid x-api-key' };
      return { ok: true, detail: 'Connected.', ms: Math.round(280 + Math.random() * 400), usd: args.name === 'jev' ? 0.00002 : 0.00041 };
    }
    case 'brain.choose': await wait(120); db.conn.brain = args.kind; return { ok: true };
    case 'claudeCode.status': await wait(700); return clone(db.claudeCode);
    case 'claudeCode.setup': await wait(200); setTimeout(() => { db.claudeCode = { installed: true, signedIn: true, plan: 'Claude Max' }; }, 2500); return { ok: true };
    case 'local.scan': await wait(1300); return clone(db.servers);
    case 'perms.get': await wait(100); return clone(db.perms);
    case 'perms.grant': await wait(300); db.perms[args.id] = 'granted'; return { ok: true };
    case 'app.info': await wait(60); return clone(db.info);
    case 'window.settings': return { opened: false };   // kept for old callers; Settings is a sheet inside the page now
    case 'strings.get': return (await fetch('../ui/strings/' + args.lang + '.json')).json();
    case 'link.open': note('would open', args.url); return { ok: true };
    case 'practice.start': case 'drill.start': case 'papers.open': return { ok: true };
    case 'ask.start': note('would start an ask'); return { ok: true };
    case 'speech.status': await wait(120); return clone(db.speech || {});
    case 'speech.test': await wait(1500); return { text: args.lang === 'hi' ? 'कैलकुलेटर खोलो' : 'open Calculator', engine: 'speech' };
    case 'voices.list': await wait(80); return clone(db.voices || {});
    case 'voices.preview': note('would speak in', args.lang); return { ok: true };
    case 'globe.fix': note('would open Keyboard Settings'); return { ok: true };
    case 'bar.reset': note('would reset the bar'); return { ok: true };
    case 'dictionary.list': await wait(80); return clone(db.dictionary || { words: [], fixes: {} });
    case 'dictionary.add': {
      await wait(150); const w = String(args.word || '').trim();
      if (!w || w.length > 80) return { ok: false };
      db.dictionary = db.dictionary || { words: [], fixes: {} }; if (!db.dictionary.words.includes(w)) db.dictionary.words.push(w); return { ok: true };
    }
    case 'dictionary.remove': await wait(120); db.dictionary.words = db.dictionary.words.filter(x => x !== args.word); return { ok: true };
    default: throw new Error('mock: unknown method ' + method);
  }
}

// Called synchronously from inside the iframe, exactly where WKWebView's postMessage would be.
window.mockHome = function (msg) {
  note('→', msg.method, JSON.stringify(msg.args || {}));
  handle(msg.method, msg.args || {}).then(
    r => frame.contentWindow.bridge.reply(msg.id, r === undefined ? null : r, null),
    e => { note('✗', msg.method, e.message); frame.contentWindow.bridge.reply(msg.id, null, e.message); });
};

// "activity": "auto" → a believable, repeatable 16 weeks ending today with a 5-day streak.
function activity() {
  const out = {}, d = new Date(); let seed = 7;
  for (let i = 0; i < 112; i++) {
    seed = (seed * 9301 + 49297) % 233280;
    const n = i < 5 ? 3 + (seed % 9) : (seed % 10 < 4 ? 0 : seed % 14);
    if (n) out[`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`] = n;
    d.setDate(d.getDate() - 1);
  }
  return out;
}
async function load() {
  db = times(clone(FIXTURES[ui.fx]));
  if (db.state && db.state.activity === 'auto') db.state.activity = activity();
  if (db.state && typeof db.state === 'object') db.state.lang = ui.lang;
  db.prefs.lang = ui.lang;
  if (!page) page = await (await fetch('../ui/home.html', { cache: 'no-store' })).text();
  // The app opens Settings with #settings; here the frame's name says so (a fragment on about:srcdoc trips up tooling).
  // native=1 adds the class Swift injects at document start; theme goes on <html> before first paint.
  const hash = `window.name=${JSON.stringify('chiron-' + ui.view.replace('/', '-'))};`
    + (ui.native ? "document.documentElement.classList.add('native');" : '')
    + (ui.theme ? `document.documentElement.dataset.theme=${JSON.stringify(ui.theme)};` : '')
    // Headless screenshots run on virtual time, which can freeze CSS transitions mid-way: show final states.
    + (BARE ? "document.head.insertAdjacentHTML('beforeend','<style>*,*::before,*::after{transition:none!important;animation:none!important}</style>');" : '');
  // <base> makes strings/ and fonts/ resolve inside ui/ like the app's loadFileURL; the fake handler goes in before page scripts.
  const inject = `<head><base href="../ui/"><script>window.webkit={messageHandlers:{home:{postMessage:m=>parent.mockHome(JSON.parse(JSON.stringify(m)))}}};${hash}<\/script>`;
  const [w, h] = SIZES[ui.w];
  frame.style.width = (BARE ? Math.min(w, innerWidth) : w) + 'px'; frame.style.height = (BARE ? innerHeight : h) + 'px';
  windowChrome();
  frame.onload = () => { theme(); if (BARE) fitHeight(); };
  frame.srcdoc = page.replace('<head>', inject);
  paint();
}
// Bare screenshots: grow the frame to its content (never shorter than the window) and record the height for the shooter.
function fitHeight() {
  const d = frame.contentDocument;
  const fit = () => {
    frame.style.height = innerHeight + 'px';
    const hgt = Math.max(innerHeight, Math.ceil(d.querySelector('.shell').getBoundingClientRect().height));
    frame.style.height = hgt + 'px'; document.documentElement.dataset.h = hgt;
  };
  new ResizeObserver(fit).observe(d.querySelector('.shell')); fit();
}
function windowChrome() {
  const host = document.getElementById('host');
  const dark = ui.theme === 'dark' || (!ui.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  host.className = ui.native ? 'win' + (dark ? ' dark' : '') : 'win-host';
  host.querySelector('.lights')?.remove();
  if (ui.native) host.insertAdjacentHTML('afterbegin', '<div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>');
  document.body.classList.toggle('desk', ui.native && !BARE); document.body.classList.toggle('dark', dark);
  // Matching colour schemes keeps the iframe see-through, so the fake vibrancy shows behind the page.
  document.documentElement.style.colorScheme = ui.theme || 'light dark';
}
function theme() {
  const d = frame.contentDocument && frame.contentDocument.documentElement;
  if (d) { if (ui.theme) d.dataset.theme = ui.theme; else delete d.dataset.theme; }
  if (!ui.native && !BARE) document.body.style.background = ui.theme === 'dark' ? '#0e0c0a' : ui.theme === 'light' ? '#e9e4dc' : '';
  windowChrome();
}
function paint() {
  document.querySelectorAll('[data-fx]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.fx === ui.fx)));
  document.querySelectorAll('[data-w]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.w === ui.w)));
  document.querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === ui.view)));
  document.querySelectorAll('[data-t]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === ui.theme)));
  document.getElementById('nativeBtn').setAttribute('aria-pressed', String(!!ui.native));
  if (!location.search) try { localStorage.setItem('chiron-mock', JSON.stringify(ui)); } catch (e) {}
}
document.querySelectorAll('[data-fx]').forEach(b => b.onclick = () => { ui.fx = b.dataset.fx; load(); });
document.querySelectorAll('[data-w]').forEach(b => b.onclick = () => {
  ui.w = b.dataset.w; const [w, h] = SIZES[ui.w]; frame.style.width = w + 'px'; frame.style.height = h + 'px'; paint();
});
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { ui.view = b.dataset.v; load(); });
document.getElementById('nativeBtn').onclick = () => { ui.native = !ui.native; load(); };
document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { ui.theme = b.dataset.t; theme(); paint(); });
document.getElementById('pushState').onclick = () => {
  const s = db.state; if (s.words && typeof s.words === 'object') { s.words.today = (s.words.today || 0) + 120; s.words.week = (s.words.week || 0) + 120; s.words.all = (s.words.all || 0) + 120; }
  frame.contentWindow.bridge.push('state', clone(s));
};
document.getElementById('pushLang').onclick = () => {
  const next = frame.contentWindow.chiron.lang === 'hi' ? 'en' : 'hi';
  db.state.lang = next; frame.contentWindow.bridge.push('lang', { lang: next });
};
document.getElementById('pushConn').onclick = () => frame.contentWindow.bridge.push('connection', { jev: { ok: true, missing: false } });
load();
</script>
</html>
